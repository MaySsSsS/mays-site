# 个人游戏数据后端：一次性登录导入凭证（D1 加密存储），定时采集 PSN / 任天堂时长与游戏信息
name = "mays-social-api"
main = "src/index.ts"
compatibility_date = "2026-04-12"
compatibility_flags = ["nodejs_compat"]

workers_dev = true
preview_urls = true

[vars]
CORS_ORIGIN = "https://linkmays.com"

# 库名 mays-social-db（2026-11-13 在控制台创建）；表结构由 src/schema.ts 首次请求时自愈创建
[[d1_databases]]
binding = "SOCIAL_DB"
database_name = "mays-social-db"
database_id = "9da12a9d-5f3d-4bd2-a533-e0d4e2acbcf0"

[observability]
enabled = true

# 每天 4 次：PSN / 任天堂都不需要更频繁
[triggers]
crons = ["0 2,8,14,20 * * *"]
