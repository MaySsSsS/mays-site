name: Sync Upload Secret

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Push GAME_UPLOAD_SECRET into mays-game-api UPLOAD_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.GAME_UPLOAD_SECRET }}
        run: |
          printf '%s' "$SECRET_VALUE" | npx -y wrangler@4.81.1 secret put UPLOAD_SECRET -c workers/game-api/wrangler.toml
          echo "---- secret list ----"
          npx -y wrangler@4.81.1 secret list -c workers/game-api/wrangler.toml
