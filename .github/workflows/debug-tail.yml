name: Debug Tail

on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: tail + probe production
        run: |
          npx -y wrangler@4.81.1 tail mays-site-web --format pretty > /tmp/tail.log 2>&1 &
          TAIL_PID=$!
          sleep 15
          for p in /games/steam /games/steam/library; do
            echo "===== $p"
            curl -s -o /tmp/body.html -w "HTTP %{http_code}\n" --max-time 30 "https://linkmays.com$p"
            head -c 300 /tmp/body.html; echo
          done
          sleep 15
          kill "$TAIL_PID" 2>/dev/null || true
          sleep 2
          echo "===== TAIL LOG ====="
          cat /tmp/tail.log
